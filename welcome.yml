name: Welcome New Contributors

on: 
  pull_request:
    types: [opened]
    
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome message
      uses: actions/first-interaction@v1
      with:   
        repo-token: ${{secrets.GITHUB_TOKEN}}
        issue-message: 'Thank you for opening your first issue! we appreciate ypur contribution.'
        pr-message: 'Thank you for opening your first pull requaest! we appreciate your efforts.'
